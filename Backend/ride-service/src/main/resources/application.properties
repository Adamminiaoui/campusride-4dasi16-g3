spring.application.name=ride-service
server.port=${PORT:8083}
# Sans profil : demarrage Eureka seul, sans base. Le profil crud reactive JPA + MySQL.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Eureka de l'equipe : inscription sur le premier serveur disponible, l'autre sert de secours.
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://10.95.213.175:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
