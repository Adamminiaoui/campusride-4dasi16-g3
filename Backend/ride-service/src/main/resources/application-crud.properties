spring.autoconfigure.exclude=
spring.config.import=optional:file:./Backend/ride-service/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${RIDE_DB_URL:jdbc:mysql://localhost:3306/ride_db}
spring.datasource.username=${RIDE_DB_USERNAME:ride_svc}
spring.datasource.password=${RIDE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Villes de reference chargees au demarrage par data.sql (INSERT IGNORE : pas de doublon).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
