<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Recommandations CampusRide</title>
<style>body{font:16px system-ui;background:#f4f8f4;color:#183e31;max-width:850px;margin:3rem auto;padding:0 1rem}form,article{background:white;padding:1.5rem;border:1px solid #d8e8de;border-radius:12px;margin:1rem 0}label{display:inline-grid;gap:.4rem;margin:.5rem}input,button{font:inherit;padding:.6rem;border:1px solid #b5cfc0;border-radius:6px}button{background:#17664e;color:white;cursor:pointer}small{color:#586d60}#results{display:grid;gap:.5rem}</style></head>
<body><h1>Trajets recommandés</h1><p>Données de démonstration pour tester le classement.</p><form id="search">
<label>Ville de départ (ID)<input name="fromCityId" type="number" min="1" value="1" required></label><label>Ville d’arrivée (ID)<input name="toCityId" type="number" min="1" value="2" required></label>
<label>Date<input name="date" type="date" required></label><label>Heure souhaitée<input name="preferredTime" type="time" value="08:00" required></label><label>Budget maximum<input name="maxPrice" type="number" min="0" value="15" required></label><label>Places<input name="minSeats" type="number" min="1" value="2" required></label><button>Rechercher</button></form><p id="message" role="status"></p><div id="results"></div>
<script>document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);document.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#results'),msg=document.querySelector('#message');out.replaceChildren();try{const r=await fetch('/api/recommendations?'+new URLSearchParams(new FormData(e.target)));const data=await r.json();if(!r.ok)throw new Error(data.message);msg.textContent=data.length+' trajet(s) trouvé(s)';for(const ride of data){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=`Trajet #${ride.id} · ${ride.score}/100`;const text=document.createElement('p');text.textContent=`${ride.fromCity} → ${ride.toCity} · ${ride.departureTime} · ${ride.price} · ${ride.availableSeats} place(s) · note ${ride.driverRating}/5`;const detail=document.createElement('small');detail.textContent=ride.explanation;card.append(title,text,detail);out.append(card)}}catch(err){msg.textContent=err.message||'Service indisponible'}};</script></body></html>
