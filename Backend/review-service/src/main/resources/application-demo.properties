# Profil de demonstration locale CampusRide
spring.application.name=review-service

server.port=8086
server.address=127.0.0.1

# Ne pas publier le service de demonstration dans Eureka
eureka.client.enabled=false

# Identifiant fictif de l'auteur
review.demo.author-id=1

# Base MariaDB locale existante
spring.datasource.url=jdbc:mariadb://localhost:3306/review_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# Observabilite Actuator pour demonstration locale
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=CampusRide Review Service
info.app.description=Gestion des avis et reputations
info.app.version=0.1.0