# Profil de demonstration locale CampusRide
spring.application.name=review-service

server.port=8086
server.address=127.0.0.1

# Ne pas publier le service de demonstration dans Eureka
eureka.client.enabled=false

# Identifiant fictif de l'auteur
review.demo.author-id=1

# Base MariaDB locale existante
