
# ============================================
# CAMPUSRIDE - REVIEW SERVICE
# ============================================

# Configuration Spring Boot
spring.application.name=review-service
server.port=8086

# ============================================
# BASE DE DONNEES MARIADB
# ============================================

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/review_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================
# JPA / HIBERNATE
# ============================================

# Mise a jour automatique des tables en developpement
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

# Affichage des requetes SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desactiver Open Session in View
spring.jpa.open-in-view=false

# Integration is opt-in until the team's real Eureka address is supplied.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:}

# Keycloak / OIDC. Without an issuer, protected routes reject all bearer tokens.
review.security.issuer-uri=${JWT_ISSUER_URI:}
review.security.audience=${JWT_AUDIENCE:}
review.security.user-id-claim=${JWT_USER_ID_CLAIM:sub}
review.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}

# Documented Booking endpoint; JSON response shape must be confirmed with its owner.
review.booking.base-url=${BOOKING_URL:}
review.booking.internal-key=${INTERNAL_API_KEY:}
review.booking.eligibility-pointer=${BOOKING_ELIGIBILITY_POINTER:UNCONFIGURED}
