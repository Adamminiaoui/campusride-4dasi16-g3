spring.autoconfigure.exclude=
spring.config.import=optional:file:./Backend/booking-service/application-local.properties,optional:file:./application-local.properties
server.address=${BOOKING_BIND_ADDRESS:127.0.0.1}
eureka.client.enabled=${BOOKING_EUREKA_ENABLED:false}
eureka.instance.ip-address=${BOOKING_ADVERTISED_ADDRESS:127.0.0.1}
spring.datasource.url=${BOOKING_DB_URL:jdbc:mysql://localhost:3306/booking_db}
spring.datasource.username=${BOOKING_DB_USERNAME:booking_svc}
spring.datasource.password=${BOOKING_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
